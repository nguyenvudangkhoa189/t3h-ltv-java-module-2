<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Tìm kiếm sản phẩm')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<header class="page-header">
    <div class="container">
        <h1 class="display-5 fw-bold text-success">Kết quả tìm kiếm</h1>
        <p class="lead text-muted">
            Từ khóa: <strong th:text="${keyword}">keyword</strong>
        </p>
    </div>
</header>

<main class="container py-4" th:if="${total > 0}">
    <p class="text-muted mb-4" th:text="'Tìm thấy ' + ${total} + ' sản phẩm'">Tìm thấy 0 sản phẩm</p>
    <div class="row g-4">
        <div class="col-md-6 col-lg-4 col-xl-3" th:each="product : ${products}">
            <div class="card product-card h-100 shadow-sm">
                <img th:src="${product.thumbnail}" th:alt="${product.title}"
                     class="card-img-top product-img" alt="product"/>
                <div class="card-body d-flex flex-column">
                    <span class="badge bg-light text-success mb-2" th:text="${product.category}">category</span>
                    <h5 class="card-title" th:text="${product.title}">Product title</h5>
                    <p class="card-text text-muted small flex-grow-1"
                       th:text="${#strings.abbreviate(product.description, 100)}">Description</p>
                    <div class="d-flex justify-content-between align-items-center mt-2">
                        <span class="fw-bold text-success fs-5"
                              th:text="'$' + ${product.price}">$0</span>
                        <a class="btn btn-outline-success btn-sm"
                           th:href="@{/product_detail(id=${product.id})}">Chi tiết</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<main class="container py-5 text-center" th:if="${total == 0}">
    <div class="empty-state">
        <h2 class="text-muted">Không tìm thấy sản phẩm</h2>
        <p class="text-muted">Không có sản phẩm nào chứa từ khóa "<span th:text="${keyword}">keyword</span>".</p>
        <a th:href="@{/home}" class="btn btn-success mt-3">Về trang chủ</a>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
