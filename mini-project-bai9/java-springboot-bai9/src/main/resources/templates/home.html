<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Danh sách sản phẩm')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<header class="page-header">
    <div class="container">
        <h1 class="display-5 fw-bold text-success">Fresh Fruits Shop</h1>
        <p class="lead text-muted">Danh sách sản phẩm từ DummyJSON</p>
        <span class="badge bg-success" th:text="'Tổng: ' + ${total} + ' sản phẩm'">Tổng: 0 sản phẩm</span>
    </div>
</header>

<main class="container py-4">
    <div class="row g-4">
        <div class="col-md-6 col-lg-4 col-xl-3" th:each="product : ${products}">
            <div class="card product-card h-100 shadow-sm">
                <img th:src="${product.thumbnail}" th:alt="${product.title}"
                     class="card-img-top product-img" alt="product"/>
                <div class="card-body d-flex flex-column">
                    <span class="badge bg-light text-success mb-2" th:text="${product.category}">category</span>
                    <h5 class="card-title" th:text="${product.title}">Product title</h5>
                    <p class="card-text text-muted small flex-grow-1"
                       th:text="${#strings.abbreviate(product.description, 100)}">Description</p>
                    <div class="d-flex justify-content-between align-items-center mt-2">
                        <span class="fw-bold text-success fs-5"
                              th:text="'$' + ${product.price}">$0</span>
                        <a class="btn btn-outline-success btn-sm"
                           th:href="@{/product_detail(id=${product.id})}">Chi tiết</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
